# Entorno completo: PostgreSQL 16, API (FastAPI) y web (Next.js).
#   cp .env.example .env   # y cambia ROOT_PASSWORD y JWT_SECRET
#   docker compose up --build
# Web: http://localhost:3000 · API: http://localhost:8000/docs
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: tiquetes
    volumes:
      - datos:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tiquetes"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./apps/api
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/tiquetes
      JWT_SECRET: ${JWT_SECRET:-cambia-esto-por-un-secreto-largo-de-32-caracteres}
      ROOT_PASSWORD: ${ROOT_PASSWORD:-cambiame}
      CORS_ORIGENES: http://localhost:3000
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USUARIO: ${SMTP_USUARIO:-}
      SMTP_CONTRASENA: ${SMTP_CONTRASENA:-}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      API_URL: http://api:8000
      # En local se sirve por http; en producción detrás de https quita esta variable.
      COOKIE_INSEGURA: "1"
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  datos:
